# Embedding-step parameters per (embedder × dataset type × component).
#
# The Phase 4 entry point (src/lilac/lcg_constructor/embed_runner.py) iterates
# over every (dataset, component) combo for the chosen embedder. For each combo
# it looks up parameters with the following precedence:
#
#   1. embedders.<EMB>.per_dataset.<DS>.<input_component>          (override)
#   2. embedders.<EMB>.params_by_type.<dataset_type>.<input_component>  (default)
#
# Component names below use the {in: <serialization_basename>, out: <pt_basename>}
# form so the on-disk corpus produced by step 7
# (e.g. ``table+image+summary.json``) maps to a clean tensor name (``table.pt``).
# When a component name is given as a plain string, in == out.
#
# To add a new dataset that uses the default settings, you usually need 0 lines
# of YAML here — just register the dataset under retriever_metadata.yaml with
# the right `type` (`vqa` or `multimodalqa`).
#
# To support a new dataset type, add an entry to `components_by_type` and
# `params_by_type` under each embedder.

embedders:

  # ── MM-Embed ───────────────────────────────────────────────────────────────
  MM-Embed:
    components_by_type:
      vqa:
        - text
        - sentence
        - {in: table+image+summary,         out: table}
        - {in: table_segment+image+summary, out: table_segment}
        - {in: image+image+summary,         out: image}
        - {in: subimage+image+summary,      out: subimage}
        - page
      multimodalqa:
        - text
        - sentence
        - {in: table+image+summary,         out: table}
        - {in: table_segment+image+summary, out: table_segment}
        - {in: image+image+summary,         out: image}
        - {in: subimage+image+summary,      out: subimage}
        - page

    params_by_type:
      vqa:
        text:                          {max_length: 4096,  batch_size: 1}
        sentence:                      {max_length: 4096,  batch_size: 8}
        table+image+summary:           {max_length: 4096,  batch_size: 1}
        table_segment+image+summary:   {max_length: 4096,  batch_size: 1}
        image+image+summary:           {max_length: 4096,  batch_size: 1}
        subimage+image+summary:        {max_length: 4096,  batch_size: 4}
        page:                          {max_length: 4096,  batch_size: 1}
      multimodalqa:
        text:                          {max_length: 1024, batch_size: 16}
        sentence:                      {max_length: 128,  batch_size: 64}
        table+image+summary:           {max_length: 512,  batch_size: 10}
        table_segment+image+summary:   {max_length: 256,  batch_size: 16}
        image+image+summary:           {max_length: 256,  batch_size: 8}
        subimage+image+summary:        {max_length: 256,  batch_size: 8}
        page:                          {max_length: 4096, batch_size: 1}

    per_dataset: {}

  # ── UniME ──────────────────────────────────────────────────────────────────
  UniME:
    components_by_type:
      vqa:
        - text
        - sentence
        - {in: table+image+summary,         out: table}
        - {in: table_segment+image+summary, out: table_segment}
        - {in: image+image+summary,         out: image}
        - {in: subimage+image+summary,      out: subimage}
        - page
      multimodalqa:
        - text
        - sentence
        - {in: table+image+summary,         out: table}
        - {in: table_segment+image+summary, out: table_segment}
        - {in: image+image+summary,         out: image}
        - {in: subimage+image+summary,      out: subimage}
        - page

    params_by_type:
      vqa:
        text:                          {max_length: 256,  batch_size: 32}
        sentence:                      {max_length: 128,  batch_size: 32}
        table+image+summary:           {max_length: 256,  batch_size: 32}
        table_segment+image+summary:   {max_length: 128,  batch_size: 32}
        image+image+summary:           {max_length: 4096, batch_size: 1}
        subimage+image+summary:        {max_length: 256,  batch_size: 8}
        page:                          {max_length: 4096, batch_size: 1}
      multimodalqa:
        text:                          {max_length: 1024, batch_size: 16}
        sentence:                      {max_length: 128,  batch_size: 64}
        table+image+summary:           {max_length: 512,  batch_size: 10}
        table_segment+image+summary:   {max_length: 256,  batch_size: 16}
        image+image+summary:           {max_length: 256,  batch_size: 8}
        subimage+image+summary:        {max_length: 256,  batch_size: 8}
        page:                          {max_length: 4096, batch_size: 1}

    per_dataset: {}

  # ── mmE5 ───────────────────────────────────────────────────────────────────
  MMe5:
    components_by_type:
      vqa:
        - {in: image+image+summary,    out: image}
        - sentence
        - {in: table_segment+summary,  out: table}
        - {in: subimage+image+summary, out: subimage}
        - page
      multimodalqa:
        - text
        - sentence
        - {in: table+image+summary,    out: table}
        - {in: image+image+summary,    out: image}
        - {in: subimage+image+summary, out: subimage}
        - page

    params_by_type:
      vqa:
        image+image+summary:           {max_length: 256,  batch_size: 12}
        sentence:                      {max_length: 256,  batch_size: 12}
        table_segment+summary:         {max_length: 256,  batch_size: 12}
        subimage+image+summary:        {max_length: 256,  batch_size: 12}
        page:                          {max_length: 4096, batch_size: 12}
      multimodalqa:
        text:                          {max_length: 2048, batch_size: 12}
        sentence:                      {max_length: 2048, batch_size: 12}
        table+image+summary:           {max_length: 4096, batch_size: 12}
        image+image+summary:           {max_length: 4096, batch_size: 12}
        subimage+image+summary:        {max_length: 4096, batch_size: 12}
        page:                          {max_length: 4096, batch_size: 12}

    per_dataset: {}
